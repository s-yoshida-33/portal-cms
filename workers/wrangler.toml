# KV namespace for token caching and claim replay-protection.
# Create via: wrangler kv namespace create "PORTAL_CACHE"
# Then replace the id value below with the output ID.
# [[kv_namespaces]]
# binding = "PORTAL_CACHE"
# id      = "REPLACE_WITH_KV_NAMESPACE_ID"

# エンドポイント一覧:
#   GET  /v1/device?pendingId=xxx   承認済みデバイスの deviceId + deviceToken を取得
#   POST /v1/register               デバイス登録申請 (registrationToken 認証)
#   POST /v1/heartbeat              一括ステータス報告 (deviceToken 認証) + スクリーンショット命令応答
#   POST /v1/logs                   WARN/ERROR ログ送信 (deviceToken 認証)
