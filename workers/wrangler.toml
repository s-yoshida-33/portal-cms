# エンドポイント一覧:
#   GET  /v1/device?pendingId=xxx          承認済みデバイスの deviceId + deviceToken を取得 (registrationToken 認証)
#   GET  /v1/screenshot/pending?pendingId= スクリーンショット撮影リクエスト確認 (registrationToken 認証)
#   GET  /v1/screenshot/{deviceId}         スクリーンショット取得 (Firebase ID token 認証)
#   POST /v1/register                      デバイス登録申請 (registrationToken 認証)
#   POST /v1/heartbeat                     一括ステータス報告 + スクリーンショット命令応答 (deviceToken 認証)
#   POST /v1/status                        ステータス報告 旧形式・後方互換 (registrationToken 認証)
#   POST /v1/logs                          WARN/ERROR ログ送信 (deviceToken または registrationToken 認証)
#   POST /v1/screenshot                    スクリーンショット送信 (deviceToken または registrationToken 認証)
